<!DOCTYPE html>
<html lang="en" data-theme="default-dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Design-Kit Workshop</title>
  <link rel="stylesheet" href="../src/index.css" />
  <link rel="stylesheet" href="../src/themes/default-dark.css" />
  <link rel="stylesheet" href="../src/themes/default-light.css" />
  <link rel="stylesheet" href="../src/themes/server-panel.css" />
  <link rel="stylesheet" href="../src/themes/codex.css" />
  <link rel="stylesheet" href="../src/themes/tectonic.css" />
  <link rel="stylesheet" href="../src/themes/image-hoard.css" />
  <link rel="stylesheet" href="../src/themes/image-annotate.css" />
  <link rel="stylesheet" href="./src/workshop.css" />
</head>
<body>
  <div class="ws-app">
    <!-- Header -->
    <header class="ws-header">
      <div class="ws-brand">
        <span class="ws-logo">?</span>
        <span class="ws-title">Design-Kit</span>
        <span class="ws-badge">v0.1.0</span>
      </div>
      <div class="ws-controls">
        <label for="theme-select" class="ws-theme-label">Active Theme:</label>
        <select id="theme-select" class="ws-select">
          <option value="default-dark">Default Dark</option>
          <option value="default-light">Default Light</option>
          <option value="server-panel">Server Panel (Industrial)</option>
          <option value="codex">Codex (Scholar/Warm)</option>
          <option value="tectonic">Tectonic (Obsidian/Violet)</option>
          <option value="image-hoard">Image Hoard (True Dark)</option>
          <option value="image-annotate">Image Annotate (High Contrast)</option>
        </select>
      </div>
    </header>

    <!-- Main Content -->
    <main class="ws-main">
      <div class="ws-container">
        <!-- Hero Intro -->
        <section class="ws-hero">
          <h1>Design Tokens & Standards</h1>
          <p>Live interactive preview of primitive scales, semantic contracts, and theme presets.</p>
        </section>

        <!-- Token Sections Container -->
        <div id="token-viewer-root"></div>
      </div>
    </main>

    <!-- Toast Notification -->
    <div id="ws-toast" class="ws-toast" aria-hidden="true">Copied to clipboard!</div>
  </div>

  <script type="module" src="./src/main.ts"></script>
</body>
</html>
