<!DOCTYPE html>
<html lang="en" data-theme="default-dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <title>Design-Kit Workshop</title>
</head>
<body>
  <div class="ws-app">
    <!-- Header -->
    <header class="ws-header">
      <div class="ws-brand">
        <span class="ws-logo"><svg viewBox="0 0 32 32" fill="none" width="22" height="22" aria-hidden="true"><path d="M16 3.5 29 10 16 16.5 3 10Z" fill="currentColor"/><path d="M3 15 16 21.5 29 15" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" opacity="0.6"/><path d="M3 20 16 26.5 29 20" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" opacity="0.32"/></svg></span>
        <span class="ws-title">Design-Kit</span>
        <span class="ws-badge">v0.1.0</span>
      </div>

      <div class="ws-controls">
        <!-- Navigation Tabs -->
        <nav class="ws-nav-tabs">
          <button class="ws-tab-btn" data-tab="tokens" data-active="true">Tokens</button>
          <button class="ws-tab-btn" data-tab="components">Components</button>
          <button class="ws-tab-btn" data-tab="icons">Icons</button>
        </nav>

        <!-- Theme Picker -->
        <div class="ws-theme-picker">
          <label for="theme-select" class="ws-theme-label">Theme:</label>
          <select id="theme-select" class="ws-select">
            <option value="default-dark">Default Dark</option>
            <option value="default-light">Default Light</option>
            <option value="server-panel">Server Panel</option>
            <option value="codex">Codex</option>
            <option value="tectonic">Tectonic</option>
            <option value="image-hoard">Image Hoard</option>
            <option value="image-annotate">Image Annotate</option>
          </select>
        </div>
      </div>
    </header>

    <!-- Main Content Area -->
    <main class="ws-main">
      <div class="ws-container">
        <!-- Dynamic View Container -->
        <div id="ws-content-root"></div>
      </div>
    </main>

    <!-- Toast Notification -->
    <div id="ws-toast" class="ws-toast" aria-hidden="true">Copied to clipboard!</div>
  </div>

  <script type="module" src="./src/main.ts"></script>
</body>
</html>
